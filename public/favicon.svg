<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="patina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8B7A"/>
      <stop offset="100%" stop-color="#14584E"/>
    </linearGradient>
  </defs>
  <!-- Near-black ground with a verdigris field, matching the site's default
       dark theme; the brass N echoes the display serif. -->
  <rect width="100" height="100" rx="22" fill="#040605"/>
  <rect x="6" y="6" width="88" height="88" rx="18" fill="url(#patina)"/>
  <text x="50" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="58"
        fill="#E3C77E" text-anchor="middle">N</text>
</svg>
