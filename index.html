    <script>
      (function() {
        // Dark is the default: the site is built around a luminous field on a
        // black ground, and that is the first impression it should make. The
        // OS preference is deliberately not consulted for a first visit — only
        // an explicit choice the visitor made here can turn it light.
        var theme = localStorage.getItem('theme');
        if (theme !== 'light') {
          document.documentElement.classList.add('dark');
        }
      })();
